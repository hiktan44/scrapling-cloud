[project]
name = "scrapling-cloud-sdk"
version = "0.1.0"
description = "Python SDK for the Scrapling Cloud scraping/crawling/extraction API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://scrape.seymata.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrapling_cloud_sdk"]
