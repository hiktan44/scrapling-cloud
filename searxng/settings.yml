# Minimal SearXNG config for programmatic use: inherit all defaults, but
# enable the JSON response format the /v1/search endpoint depends on.
use_default_settings: true

server:
  secret_key: "${SEARXNG_SECRET:-change-me-searxng}"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  safe_search: 0
