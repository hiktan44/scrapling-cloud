name: Web kalite ve dil kontrolleri
on:
  pull_request:
  push:
    branches: [codex/f30-web-kalite-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Kilitli bağımlılıkları kur
        run: npm ci --ignore-scripts
      - name: Web regresyonlarını sınama
        run: npm run test:web
      - name: Tür kontrolü
        run: npm run typecheck
      - name: Kod kalite kontrolü
        run: npm run lint
      - name: Üretim derlemesi
        run: npm run build -- --webpack
