services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrapling_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-scrapling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrapling}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrapling} -d ${POSTGRES_DB:-scrapling_cloud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: queued jobs must never be silently dropped under memory
    # pressure. Keep maxmemory comfortably below the container limit.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    # settings.yml is injected as an inline compose config (not a host bind
    # mount): Coolify's artifact dir made the relative bind path resolve to a
    # non-existent source, so Docker created the mount target as a directory
    # and SearXNG crash-looped. A config mounts real file content, so the
    # entrypoint sees an existing settings.yml and skips template generation.
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Scrapling Cloud}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://scrapling:scrapling@postgres:5432/scrapling_cloud}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_API_KEY: ${DEMO_API_KEY:-sk_demo_local_development_key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@scrapling.cloud}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      LLM_PROVIDER: ${LLM_PROVIDER:-zai}
      Z_AI_API_KEY: ${Z_AI_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/paas/v4}
      ZAI_MODEL: ${ZAI_MODEL:-glm-5.1}
      PROXY_PROVIDER_URL: ${PROXY_PROVIDER_URL:-}
      PROXY_PROVIDER_TOKEN: ${PROXY_PROVIDER_TOKEN:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "scrapling_cloud.worker"]
    environment:
      APP_NAME: ${APP_NAME:-Scrapling Cloud}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://scrapling:scrapling@postgres:5432/scrapling_cloud}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_API_KEY: ${DEMO_API_KEY:-sk_demo_local_development_key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@scrapling.cloud}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      LLM_PROVIDER: ${LLM_PROVIDER:-zai}
      Z_AI_API_KEY: ${Z_AI_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/paas/v4}
      ZAI_MODEL: ${ZAI_MODEL:-glm-5.1}
      PROXY_PROVIDER_URL: ${PROXY_PROVIDER_URL:-}
      PROXY_PROVIDER_TOKEN: ${PROXY_PROVIDER_TOKEN:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f scrapling_cloud.worker || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

configs:
  searxng_settings:
    content: |
      use_default_settings: true
      server:
        secret_key: "scrapling-cloud-searxng-internal-only"
        limiter: false
        image_proxy: false
      search:
        formats:
          - html
          - json
        safe_search: 0

volumes:
  postgres_data:
  redis_data:
